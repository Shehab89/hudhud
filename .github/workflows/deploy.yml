name: deploy

# Publishes container images to GitHub Container Registry on every push to main and on
# version tags. Rolling them out to a host is REQUIRES CONFIGURATION: set the repository
# secret DEPLOY_WEBHOOK_URL to your host's deploy hook (Render, Fly, Railway, a VPS
# webhook...), and the variables NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SITE_URL.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend.Dockerfile
          - name: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_ML=true
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=deploy-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.name }}

  rollout:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger host deploy hook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::notice::DEPLOY_WEBHOOK_URL not set; images were published but nothing was rolled out (REQUIRES CONFIGURATION)."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
