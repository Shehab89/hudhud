name: nli-bench

# Times the zero-shot model on a GitHub runner (seconds per text and per label, with a few
# settings), to decide what the scheduled run can afford. Needs no secrets.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[ml]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-${{ hashFiles('database/seeds/models.yaml', 'backend/hudhud/config.py') }}
          restore-keys: hf-models-
      - run: |
          mkdir -p result
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Flags" | cut -c1-200 | tee result/bench.txt
      - run: python scripts/bench_zero_shot.py 2>&1 | grep -v "HTTP Request\|Loading weights\|Warning" | tee -a result/bench.txt
      - name: Publish to bench-result branch
        if: always()
        run: |
          cd result
          git init -q -b bench-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "NLI benchmark $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bench-result
