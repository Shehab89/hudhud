name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hudhud
          POSTGRES_PASSWORD: hudhud
          POSTGRES_DB: hudhud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hudhud"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hudhud:hudhud@localhost:5432/hudhud_test
      NLP_BACKEND: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,llm]"
      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          cd backend && alembic upgrade head && alembic check && alembic downgrade base
      - name: Tests
        run: pytest --cov=hudhud --cov-report=term-missing:skip-covered
      - name: Registry validates
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: hudhud check-sources

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
