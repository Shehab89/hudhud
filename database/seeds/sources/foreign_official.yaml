      and warnings, and it is a direct party to the July-September 2026 Saudi-Houthi hostilities.
    audience_evidence: []
    influence_evidence:
      regional_importance: high
      cited_by_other_media: high
      historical_importance: high
      note: Statements by the coalition spokesperson (Maj. Gen. Turki al-Maliki) are carried by SPA, QNA, AP and
        others, e.g. the 4 July 2026 warning of an "unprecedented" response, the 8 September 2026 statement on attacks
        on southern Saudi cities and the 24 September 2026 statement.
      urls:
