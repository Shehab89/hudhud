    yemen_coverage:
      frequency: weekly
      evidence: Since the truce collapsed in July 2026 the coalition has issued statements on Houthi attacks and
        its operations several times a month; all of its output concerns Yemen.
      urls:
      - https://tribune.com.pk/story/2631200/saudi-arabia-reports-fresh-houthi-attacks-issues-warning-for-makkah
    institutional_importance:
      level: high
      note: The coalition's military command; in December 2025 its spokesperson's statement on the Mukalla strike
        triggered the UAE's public rebuttal and withdrawal, and in 2026 it announces Saudi military action in Yemen.
