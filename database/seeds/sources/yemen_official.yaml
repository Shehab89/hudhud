    type: telegram_public
    verified: false
    verified_at: null
    yemen_filter: false
    notes: candidate; stcaden.com links Telegram as the malformed URL http://t.me/telegram.me/STCSouthArabia (seen
      2026-10-04); handle STCSouthArabia inferred from it and from the matching X and Facebook handles. Check the
      channel exists before collecting. The site RSS (https://www.stcaden.com/rss) is already in the old registry.
  selection:
    reason: Official platform of the main southern separatist organisation; publishes statements of its presidency,
      General Secretariat and local bodies, which remain central to the southern question despite the disputed January
      2026 dissolution.
    yemen_coverage:
      frequency: daily
      evidence: Homepage on 2026-10-04 carried a statement of an expanded extraordinary meeting of central and local
        bodies, a "presidential" message to southern forces and the emblem of a 14 October 2026 mobilisation event.
      urls:
      - https://stcaden.com/
    institutional_importance:
      level: high
      note: '2026 status, as the sources describe it: after the Saudi-backed campaign in Hadramawt and al-Mahra
        and the PLC takeover of Aden (2026-01-07), STC members in Riyadh led by secretary-general Ahmed Saeed bin
        Brik announced the council''s dissolution on 2026-01-09 (Anadolu, Al Jazeera). The UAE-based spokesman Anwar
        al-Tamimi and members abroad rejected it as made under pressure and said the STC remained operational (Wikipedia).
        Chairman Aidarus al-Zubaidi left Aden on 2026-01-07 for Somaliland and then the UAE (Wikipedia) and was
        dismissed from the PLC. The council renamed itself the Southern Arab Transitional Council around April-May
        2026 (Erem News), held a mass rally in Aden on 2026-05-04 (South24), and in September 2026 its foreign-affairs
        representative Amr al-Bidh spoke from Abu Dhabi, calling the dissolution coerced (Al-Monitor). It therefore
        operates as a contested, partly exiled organisation with activity still visible in Aden.'
  alignment:
    yemen_political_alignment: stc
    sub_alignment: Faction that rejected the January 2026 dissolution (al-Zubaidi, al-Tamimi, al-Bidh); not the
      Riyadh-based members who announced it
    regional_alignment: uae
    domestic_political_orientation: movement_aligned
    classification_confidence: 0.85
    classification_evidence: The site presents itself as the council's official platform. Wikipedia (2026 in Yemen)
      calls the STC UAE-backed; its spokesman and foreign-affairs representative operate from the UAE (Wikipedia;
      Al-Monitor, 2026-09-17).
    evidence_urls:
    - https://stcaden.com/
    - https://en.wikipedia.org/wiki/2026_in_Yemen
    - https://en.wikipedia.org/wiki/Southern_Transitional_Council
    - https://www.al-monitor.com/originals/2026/09/yemen-separatists-urge-us-not-let-saudi-arabia-call-shots
    method: self_description
    assessment_date: 2026-10-04
    review_status: draft
  ownership:
    description: Official platform of the Southern Transitional Council (self-description).
    evidence_urls:
    - https://www.stcaden.com/
  scores:
    reliability_score: null
  access_policy: metadata_only
  active: true
  notes: 'Old id kept (stc-official); its verified RSS https://www.stcaden.com/rss carries over. Sources for the
    2026 status: https://www.aa.com.tr/en/middle-east/yemen-s-stc-announces-dissolution-of-all-bodies-ends-operations/3794864
    ; https://aljazeera.com/news/2026/1/9/yemens-separatist-southern-transitional-council-announces-its-dissolution
    ; https://south24.net/news/newse.php?nid=5469 ; https://www.eremnews.com/news/arab-world/ezubz6l ; https://en.wikipedia.org/wiki/Fall_of_Aden_(2026).
    operating_base unknown: the organisation is active in Aden (government-held since January 2026) while its leadership
    is partly in the UAE. Treat output as that of the faction rejecting the dissolution; the Riyadh-based former
    members speak through other channels. English site: https://en.stcaden.com/ (Wikipedia). The STC''s status after
    the January 2026 dissolution is contested; recheck before labelling outputs. operating_base left unknown for
    the same reason. Newsroom: Aden (contested) (unknown). Contested, so left unknown. The STC''s main HQ is in
    Aden. Wikipedia (Fall of Aden 2026) says PLC forces took Aden on 2026-01-07 and the STC announced its dissolution
    on 2026-01-09. South24 (June 2026) reports the Aden HQ reopening after a two-day closure by "a military force",
    with the STC rejecting the dissolution. The organisation runs in a government-held city while its legal status
    is disputed, and part of its leadership (al-Zubaidi) is in the UAE per Wikipedia. stc_controlled no longer fits.
    government_controlled for the territory, or outside_yemen for leadership, are both arguable. Sources: https://south24.net/news/newse.php?nid=5543,
    https://en.wikipedia.org/wiki/Fall_of_Aden_(2026)'
