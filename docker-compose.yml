# Local stack: database, API and frontend.
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose run --rm pipeline observatory migrate
#   docker compose run --rm pipeline observatory seed
#   docker compose run --rm pipeline observatory demo-data      # optional, labelled DEMO DATA
#   docker compose run --rm pipeline observatory run
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observatory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatory}
      POSTGRES_DB: ${POSTGRES_DB:-observatory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observatory}"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-observatory}:${POSTGRES_PASSWORD:-observatory}@db:5432/${POSTGRES_DB:-observatory}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/models

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      # server-side rendering talks to the API over the compose network
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # One-off jobs: migrations, seeding and the daily pipeline.
  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-observatory}:${POSTGRES_PASSWORD:-observatory}@db:5432/${POSTGRES_DB:-observatory}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - models:/models
    command: ["observatory", "run"]

volumes:
  pgdata:
  models:
