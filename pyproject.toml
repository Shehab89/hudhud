[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "observatory"
version = "0.1.0"
description = "Multilingual computational platform for monitoring and researching media discourse about Yemen"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "trafilatura>=1.12",
  "lingua-language-detector>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "rapidfuzz>=3.9",
  "datasketch>=1.6",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Transformer models (embeddings, sentiment, zero-shot, NER) and BERTopic.
# Installed in Docker and GitHub Actions; the platform falls back to light
# deterministic methods when these are absent (and records that it did).
ml = [
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "torch>=2.3",
  "bertopic>=0.16.4",
  "umap-learn>=0.5.6",
  "hdbscan>=0.8.38",
]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "pytest-cov>=5"]

[project.scripts]
observatory = "observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/observatory"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
markers = [
  "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
  "ml: needs transformer models downloaded",
]

[tool.ruff]
line-length = 110
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S608: SQL strings interpolate only internal constants (column names, fixed fragments);
# every user-supplied value is a bound parameter. S110: best-effort optional features.
ignore = ["S101", "S311", "B008", "E501", "S608", "S110", "S105"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S"]
